name: Prüfen
on:
  push:
  pull_request:
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typen prüfen
        run: npm run typecheck
      - name: Datenbankschema + Regeln testen
        run: npm run test:schema
      - name: App bauen
        run: npx vite build
